<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 3 Study System</title>
<style>
:root{--bg:#f6f2ea;--bg2:#efe8da;--ink:#1f2421;--soft:#4a5049;--seal:#b23a2e;--gold:#a9822f;--line:#d8cfba;--card:#fbf8f2;--good:#4d7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--bg2:#1f2123;--ink:#ece7db;--soft:#b8b2a1;--seal:#d6584a;--gold:#cba24f;--line:#35362f;--card:#1f2123;--good:#7fb07f}}
:root[data-theme="dark"]{--bg:#17181a;--bg2:#1f2123;--ink:#ece7db;--soft:#b8b2a1;--seal:#d6584a;--gold:#cba24f;--line:#35362f;--card:#1f2123;--good:#7fb07f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC",Georgia,serif;padding:18px 14px 70px;display:flex;justify-content:center}
.wrap{width:100%;max-width:560px}h1{font-size:19px;margin:0;text-align:center}.sub{text-align:center;font:italic 12px Georgia;color:var(--soft);margin:3px 0 12px}
nav{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}nav button{flex:1;font:13px Georgia;padding:9px 6px;background:none;border:0;border-bottom:2px solid transparent;color:var(--soft);cursor:pointer;white-space:nowrap}nav button.on{color:var(--seal);border-color:var(--seal)}
.box{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px;margin-bottom:12px}
.g{font-family:Georgia,serif}.soft{color:var(--soft);font-size:12.5px}h2{font:600 15px Georgia;margin:0 0 8px}h3{font:600 13px Georgia;margin:12px 0 4px;color:var(--gold)}
.btn{font:13px Georgia;padding:10px 18px;border-radius:999px;border:1px solid var(--seal);background:var(--seal);color:#fff;cursor:pointer}.btn.o{background:none;color:var(--seal)}.btn:disabled{opacity:.4}
.chip{font:12px Georgia;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--soft);cursor:pointer;margin:2px}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.c{justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.st{border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;background:var(--card)}.st b{display:block;font:600 22px Georgia}.st span{font:11px Georgia;color:var(--soft)}

.meta{display:flex;justify-content:space-between;font:11px Georgia;color:var(--soft);margin-bottom:6px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.grades button{font:12px Georgia;padding:9px 2px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.grades button small{display:block;color:var(--soft);font-size:10px}
.grades button:nth-child(1){border-color:var(--seal)}.grades button:nth-child(4){border-color:var(--good)}
.fam{font:13px Georgia;line-height:1.7}.fam b{font:20px "Songti SC",serif;margin-right:4px}.fam a{display:inline-block;margin:0 8px 0 0;color:var(--ink)}.fam a u{text-decoration:none;color:var(--soft);font-size:11px}
textarea{width:100%;font:13px Georgia;background:var(--bg2);color:var(--ink);border:1px dashed var(--line);border-radius:8px;padding:8px;min-height:60px}input[type=search]{width:100%;font:14px Georgia;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;font:15px Georgia;padding:13px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.opt.hz{font:30px "Songti SC",serif;text-align:center}.opt.ok{border-color:var(--good);color:var(--good)}.opt.no{border-color:var(--seal);color:var(--seal)}
.li{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}.li b{font:22px "Songti SC",serif;min-width:70px}.li span{font:13px Georgia;flex:1}.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.l{background:var(--gold)}.dot.s{background:var(--good)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow:auto;z-index:9}.md>div{max-width:540px;width:100%;background:var(--bg);border-radius:12px;padding:16px}
.guide p{font:14px/1.6 Georgia;margin:4px 0 10px}select{font:13px Georgia;padding:5px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px}[hidden]{display:none!important}
button.nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}.pad{position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:0 auto 10px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,var(--card)}
.gh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Songti SC","Noto Serif SC",serif;color:var(--soft);opacity:.2;pointer-events:none}.gh.rv{opacity:.35;color:var(--seal)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.tk{font:20px "Songti SC",serif;padding:8px 12px}.slot{min-height:52px;border:1px dashed var(--line);border-radius:8px;padding:6px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px}input.pi{width:100%;font:16px Georgia;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0}
</style></head><body><div class="wrap">

e) + 牙 (tooth) — a tooth-like point poking through a hole: to wear (clothes go over/through the body) or pierce."],["打电话","dǎdiànhuà","phr.","to make a telephone call",1,"打 (hit, 扌+丁) + 电话 (electric speech) — 'hitting' the electric-speech device: making a call."],["大","dà","adj.","big",1,"A pictograph of a person standing with arms and legs stretched wide: big."],["大家","dàjiā","pron.","everybody",1,"大 (big) + 家 (family) — the big family: everyone."],["大学","dàxué","n.","university",1,""],["大学生","dàxuéshēng","n.","university student",1,""],["到","dào","v.","to arrive; to get to",1,"至 (an arrow striking the ground) + 刂 (knife) — an arrow hitting its target: arrival."],["的","de","part.","of",1,"白 (white) + 勺 (spoon) — no real meaning, just picture a plain white spoon that 'belongs' to something."],["第","dì","pref.","sequence prefix (ordinal number marker)",1,""],["弟弟","dìdi","n.","younger brother",1,"弟 (a bound spear-shaft, marking a lower rank in order) doubled — your 'lower-ranked' little brother."],["点","diǎn","n./mw.","o’clock; spot; dot",1,"占 (occupy) + 灬 (fire dots) — a single burning point in time, a dot on the clock."],["店","diàn","n.","shop, store, inn",1,""],["电话","diànhuà","n.","telephone",1,""],["电脑","diànnǎo","n.","computer",1,"电 (electricity) + 脑 (brain, 月+凶) — an electric brain."],["电视","diànshì","n.","TV",1,"电 (electricity, a lightning bolt) + 视 (see) — a box you see through electricity."],["电影","diànyǐng","n.","film; movie",1,"电 (electricity) + 影 (shadow) — moving shadows created by electricity."],["电影院","diànyǐngyuàn","n.","cinema; movie theater",1,""],["东西","dōngxi","n.","thing",1,"东 (east, sun behind a tree) + 西 (west, a bird's nest at sunset) — everything between east and west: general 'stuff.'"],["都","dōu","adv.","both; all",1,"者 (all those who…) + 阝 (city) — the whole city, everyone — 'all.'"],["读","dú","v.","read aloud",1,"言 (speech) + 卖 (sell) — 'selling' the words aloud with your voice: reading."],["读书","dúshū","v.","to read a book",1,""],["对"," ative connection here, it's fine."],["没事","méishì","v.","it's nothing; it doesn't matter; no problem",1,""],["没有","méiyǒu","v./adv.","don't have",1,""],["妹妹","mèimei","n.","younger sister",1,"女 (woman) + 未 (not yet, a young tree not fully grown) — a woman not yet fully grown: younger sister."],["们","men","suf.","plural suffix for pronouns and nouns referring to people",1,""],["米饭","mǐfàn","n.","rice [cooked; boiled]",1,"米 (a pictograph of grains on a stalk) + 饭 (cooked food) — grains cooked into rice."],["面包","miànbāo","n.","bread",1,""],["面条儿","miàntiáor","n.","noodles",1,""],["明年","míngnián","n.","next year",1,""],["明天","míngtiān","n.","tomorrow",1,"明 (bright, 日 sun + 月 moon together = extra bright) + 天 (day) — the bright day ahead, tomorrow."],["名字","míngzi","n.","given name",1,"名 (name, 夕 evening + 口 mouth — shouting your name out in the dark to be recognized) + 字 (character)."],["哪","nǎ","pron.","which?",1,"口 (mouth) + 那 (that) — your mouth asking 'that one — which one?'"],["哪个","nǎge","pron.","which; which one",1,""],["哪里","nǎlǐ","pron.","where?",1,""],["哪儿","nǎ'ér","pron.","where?",1,"哪 (which) + 儿 (the Beijing 'r' sound) — which place, i.e. where."],["哪些","nǎxiē","pron.","which ones?",1,""],["那","nà","pron./conj.","that; those",1,"Contains 阝, the 'place' radical — 那 marks a place over there — 'that.'"],["那边","nàbiān","pron.","over there",1,""],["那个","nàge","pron.","that; that one",1,""],["那里","nàlǐ","pron.","there; that place",1,""],["那儿","nà'ér","pron.","there",1,""],["那些","nàxiē","pron.","those",1,""],["男","nán","adj.","male",1,""],["男朋友","nánpéngyou","n.","boyfriend",1,""],["呢","ne","part.","[returns; forwards a question]",1,"口 (mouth) + 尼 (nun) — a soft, gentle mouth-question: 'and you?'"],["能","néng","v.","to be able to; can",1,"A bear-like pictograph — the raw strength of a bear: physical ability."],["你","nǐ","pron.","you",1,"Person radical 亻 next to 尔 (an old word for 'you') — simply 'a person, you.'"],["你好","nǐhǎo","interj.","hello; hi",1,""],["你们"," const W=D.map((r,i)=>({id:i,h:r[0],py:r[1],pos:r[2],en:r[3],lv:r[4],mn:r[5]||''}));
const KEY='hsk3sys_v1';let S={};
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S.c=S.c||{};S.n=S.n||{};S.log=S.log||{};S.nt=S.nt||{d:0,k:0};S.set=Object.assign({np:15,lv:[1,2,3],au:false,ph:false,dir:'h2m'},S.set||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),v=$('v');
const dayN=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const act=()=>W.filter(w=>S.set.lv.includes(w.lv));
const cjk=s=>[...new Set([...s].filter(c=>/[\u4e00-\u9fff]/.test(c)))];
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const fmt=i=>i<1?'<10 min':i<30?i+' d':Math.round(i/30)+' mo';
function sched(c0,g){const t=dayN(),c=c0?{...c0}:{i:0,e:2.5,d:t,r:0,l:0};
 if(g===0){c.l++;c.r=0;c.e=Math.max(1.3,c.e-.2);c.i=0;c.d=t}
 else{if(g===1){c.i=Math.max(1,Math.round(c.i*1.2));c.e=Math.max(1.3,c.e-.15)}
  else if(g===2)c.i=c.r===0?1:c.r===1?3:Math.round(c.i*c.e);
  else{c.i=c.r===0?4:Math.round(Math.max(c.i,1)*c.e*1.3);c.e+=.15}
  c.r++;c.d=t+c.i}return c}
function logR(ok){const t=dayN(),l=S.log[t]||(S.log[t]={n:0,ok:0});l.n++;if(ok)l.ok++}
function streak(){let t=dayN(),s=0;if(!S.log[t])t--;while(S.log[t]&&S.log[t].n>0){s++;t--}return s}
function status(w){const c=S.c[w.id];return !c?'':c.i>=21?'s':'l'}
/* detalle: componentes, familias, mnemotecnia, nota */
function detail(w){
 const chars=cjk(w.h),single=h=>W.find(x=>x.h===h&&x.h.length===1);
 let comp=chars.map(ch=>{const s=single(ch),fam=W.filter(x=>x.h!==w.h&&x.h.includes(ch)).slice(0,6);
  return `<div class="fam"><b>${ch}</b>${s?esc(s.en.split(';')[0]):''}${fam.length?'<br>'+fam.map(x=>`<a onclick="openW(${x.id})">${x.h} <u>${esc(x.en.split(';')[0].slice(0,18))}</u></a>`).join(''):''}</div>`}).join('');
 const mn=w.mn?`<div class="g" style="font-size:14px;line-height:1.55">${esc(w.mn)}</div>`:`<div class="soft">No story yet. Split the character into components, make an absurd image, and link it to the meaning. Write it below: your own story works best.</div>`;
 return `<div style="text-align:center"><div class="big" style="font-size:${w.h.length>3?40:w.h.length>1?56:80}px">${w.h}</div><div class="py">${esc(w.py)} <button class="chip" onclick="speak('${w.h}')">🔊</button></div><div class="en" style="font-size:20px;margin-top:6px">${esc(w.en)}</div><div class="pos">${w.pos} · HSK ${w.lv}</div></div>
 <h3>Characters & word family</h3>${comp}<h3>Story / mnemonic</h3>${mn}
 <h3>My note</h3><textarea oninput="S.n[${w.id}]=this.value;save()" placeholder="Your story, stroke tricks…">${esc(S.n[w.id]||'')}</textarea>`}
function openW(id){const m=$('md');m.hidden=false;m.innerHTML=`<div>${detail(W[id])}<div class="row c" style="margin-top:12px"><button class="btn o" onclick="$('md').hidden=true">Close</button></div></div>`}
/* estudiar */
let ST={};
function buildQ(){const t=dayN();if(S.nt.d!==t)S.nt={d:t,k:0};
 const a=act(),due=shuf(a.filter(w=>S.c[w.id]&&S.c[w.id].d<=t));
 const nw=a.filter(w=>!S.c[w.id]).slice(0,Math.max(0,S.set.np-S.nt.k));return [...due,...nw]}
function study(){if(!ST.q){ST={q:buildQ(),i:0,show:false,n:0}}
 const w=ST.q[ST.i];
 if(!w){v.innerHTML=`<div class="box c" style="text-align:center"><h2>Session complete!</h2><p class="soft">You reviewed ${ST.n} cards. Come back tomorrow: each word is already scheduled.</p><button class="btn" onclick="ST={};go('home')">Home</button></div>`;return}
 const c=S.c[w.id],h2m=S.set.dir==='h2m';
 const front=h2m?`<div class="big" style="font-size:${w.h.length>3?46:w.h.length>2?60:w.h.length>1?74:96}px">${w.h}</div>${S.set.ph?`<div class="py">${esc(w.py)}</div>`:''}`:`<div class="en">${esc(w.en)}</div><div class="pos">${w.pos}</div>`;
 let h=`<div class="meta"><span>${c?'Review':'New'} · HSK ${w.lv}</span><span>${ST.i+1}/${ST.q.length}</span></div>`;
 if(!ST.show){h+=`<div class="box card" onclick="ST.show=true;study()">${front}<div class="soft" style="margin-top:16px">${h2m?'Think of the meaning and how it is written':'Write the character on paper'} · tap to reveal</div></div>`}
 else{h+=`<div class="box">${detail(w)}</div><div class="grades">${[0,1,2,3].map(g=>`<button onclick="gr(${g})">${['Again','Hard','Good','Easy'][g]}<small>${fmt(sched(c,g).i)}</small></button>`).join('')}</div>`}
 v.innerHTML=h;if(S.set.au&&!ST.show&&h2m)speak(w.h)}
function gr(g){const w=ST.q[ST.i];if(!S.c[w.id])S.nt.k++;S.c[w.id]=sched(S.c[w.id],g);logR(g>0);save();
 if(g===0)ST.q.splice(Math.min(ST.q.length,ST.i+4),0,w);ST.i++;ST.n++;ST.show=false;study()}
/* quiz */
let QZ={mode:'h2m',s:0,t:0};
function quiz(){const m=QZ.mode,pool=act();if(pool.length<4){v.innerHTML='<div class="box">Enable more levels on Home.</div>';return}
 const w=pool[Math.random()*pool.length|0];let cands=pool.filter(x=>x.id!==w.id&&x.h.length===w.h.length&&x.en!==w.en);if(cands.length<3)cands=pool.filter(x=>x.id!==w.id);
 const o=shuf([w,...shuf(cands).slice(0,3)]);QZ.w=w;QZ.done=false;
 const q=m==='h2m'?`<div class="big" style="font-size:${w.h.length>2?52:76}px">${w.h}</div>`:m==='m2h'?`<div class="en">${esc(w.en.split(';')[0])}</div>`:`<button class="btn" onclick="speak('${w.h}')">🔊 Listen</button>`;
 v.innerHTML=`<div class="row c" style="margin-bottom:8px">${[['h2m','汉字 → meaning'],['m2h','meaning → 汉字'],['a2h','audio → 汉字']].map(x=>`<button class="chip ${m===x[0]?'on':''}" onclick="QZ.mode='${x[0]}';quiz()">${x[1]}</button>`).join('')}</div>
 <div class="soft c" style="text-align:center;margin-bottom:8px">Correct: ${QZ.s} / ${QZ.t}</div><div class="box" style="text-align:center">${q}</div>
 <div id="qo">${o.map(x=>`<button class="opt ${m==='h2m'?'':'hz'}" data-id="${x.id}" onclick="ans(${x.id},this)">${m==='h2m'?esc(x.en.split(';').slice(0,2).join(';').slice(0,60)):x.h}</button>`).join('')}</div><div class="row c"><button class="btn o" id="qn" onclick="quiz()" hidden>Next</button></div>`;
 if(m==='a2h')speak(w.h)}

 let h=`<div class="soft" style="text-align:center;margin-bottom:6px">Official HSK 3.0 list: ${CHW.length} to recognize · ${CHW.filter(x=>x.wl).length} to write</div><div class="row c">${[['all','All'],['r1','Recognize L1'],['r2','Recognize L2'],['r3','Recognize L3'],['w','Must write'],['learn','Still learning'],['known','Known']].map(x=>`<button class="chip ${CC.f===x[0]?'on':''}" onclick="CC.f='${x[0]}';ccBuild();chars()">${x[1]}</button>`).join('')}</div><div class="row c"><button class="chip" onclick="shuf(CC.o);CC.i=0;CC.fl=false;chars()">Shuffle</button><button class="chip" onclick="ccBuild();chars()">In order</button></div><div class="meta" style="margin-top:10px"><span>${n?CC.i+1:0} / ${n}</span><span>${kn} known of ${CHW.length}</span></div><div class="bar"><i style="width:${n?(CC.i+1)/n*100:0}%"></i></div>`;
 if(!w){v.innerHTML=h+'<div class="box soft" style="text-align:center">No characters in this set.</div>';return}
 const badges=`<div class="pos">${w.rl?'recognize HSK '+w.rl:''}${w.rl&&w.wl?' · ':''}${w.wl?'✍ must write ('+(w.wl===12?'HSK 1-2':'HSK 3')+')':''}</div>`;
 const back=`<div class="big" style="font-size:90px">${w.h}</div><div class="py">${esc(w.py)}</div><div class="en" style="font-size:18px;margin-top:6px">${esc(w.en)}</div>${badges}`;
 h+=`<div class="box card" onclick="CC.fl=!CC.fl;chars()">${CC.fl?back:`<div class="big" style="font-size:110px">${w.h}</div>${badges}`}<div class="soft" style="margin-top:14px">tap to flip</div></div>`;
 if(CC.fl){h+=(w.mn?`<div class="box g" style="font-size:14px;line-height:1.55">${esc(w.mn)}</div>`:'')+(w.ex.length?`<div class="box fam"><b style="font-size:13px">Seen in</b> ${w.ex.map(x=>`<a>${x.h} <u>${esc(x.en.split(';')[0].slice(0,18))}</u></a>`).join('')}</div>`:'')}
 h+=`<div class="row c"><button class="nav" onclick="ccN(-1)">←</button><button class="btn o" onclick="CC.fl=!CC.fl;chars()">Flip</button><button class="chip" onclick="speak('${w.h}')">🔊</button>${w.wl?`<button class="chip" onclick="WR.src='c';WR.m='trace';WR.fx=CHW[${CC.o[CC.i]}];go('write')">✍ Practice</button>`:''}<button class="nav" onclick="ccN(1)">→</button></div><div class="row c" style="margin-top:12px"><button class="btn ${S.ck[w.h]?'':'o'}" onclick="S.ck['${w.h}']=!S.ck['${w.h}'];save();chars()">${S.ck[w.h]?'✓ Known':'✓ I know this'}</button><button class="btn o" onclick="ccRs()">${CC.rs?'Tap again to confirm':'Reset progress'}</button></div>`;v.innerHTML=h}
function ccN(d){if(!CC.o.length)return;CC.i=(CC.i+d+CC.o.length)%CC.o.length;CC.fl=false;chars()}
function ccRs(){if(!CC.rs){CC.rs=true;chars();setTimeout(()=>{if(CC.rs){CC.rs=false;if(cur==='chars')chars()}},4000);return}CC.rs=false;S.ck={};save();ccBuild();chars()}
document.addEventListener('keydown',e=>{if(cur!=='chars'||/TEXTAREA|INPUT/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();CC.fl=!CC.fl;chars()}else if(e.key==='ArrowRight')ccN(1);else if(e.key==='ArrowLeft')ccN(-1);else if(e.key==='k'&&CC.o.length){const c=CHW[CC.o[CC.i]].h;S.ck[c]=!S.ck[c];save();chars()}});
const TABS=[['home','Home',home],['cards','Cards',cards],['chars','Chars',chars],['study','Study',study],['quiz','Quiz',quiz],['write','Write',write],['list','List',list],['guide','Guide',guide]];let cur='home';
function go(t){cur=t;$('nav').innerHTML=TABS.map(x=>`<button class="${x[0]===t?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');TABS.find(x=>x[0]===t)[2]()}
document.addEventListener('keydown',e=>{if(cur!=='study'||/TEXTAREA|INPUT/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();if(!ST.show){ST.show=true;study()}}else if(ST.show&&'1234'.includes(e.key))gr(+e.key-1)});
go('home');
</script></body></html>
